# PhysicsTech: PostgreSQL + Python API (serves the Mini App page too) + optional Caddy for HTTPS.
#   docker compose up -d --build                    -> http://localhost:8000 (local check)
#   docker compose --profile https up -d --build    -> https://$DOMAIN (server with a domain)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: physicstech
      POSTGRES_USER: physicstech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physicstech -d physicstech"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://physicstech:${POSTGRES_PASSWORD}@db:5432/physicstech
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      DEV_AUTH: ${DEV_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      INIT_DATA_MAX_AGE: ${INIT_DATA_MAX_AGE:-86400}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}  # обязателен для профиля https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
